name: PHP Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find config.php includes links admin scripts tests -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Prepare test database
        run: |
          mkdir -p data
          php scripts/migrate.php

      - name: Authorization regression test
        run: php tests/authorization.php

      - name: Import/export regression test
        run: php tests/import-export.php

      - name: Database health check
        run: php scripts/check-db.php

      - name: Offline-first dependency check
        run: php scripts/check-offline.php
