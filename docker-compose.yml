services:
  tautan:
    build: .
    image: tautan:latest
    container_name: tautan
    restart: unless-stopped
    ports:
      # Ubah "8080" di kiri kalau port tersebut sudah dipakai di mesin Anda
      - "8080:80"
    volumes:
      # Data (database SQLite & backup) disimpan di volume terpisah supaya
      # tetap ada walau container dihapus/dibuat ulang (docker compose down).
      - tautan_data:/var/www/html/data

volumes:
  tautan_data:
